<!doctype html>
<html lang="nb">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bekkværet</title>
  <meta name="description" content="Bekkværet – nåværende vær, nedbør neste time og 7-dagersvarsel for Oslo og Trondheim.">
  <meta name="theme-color" content="#1f1f1f">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <a class="brand" href="./">Bekkværet</a>
      <nav class="switch" role="radiogroup" aria-label="Velg by"></nav>
    </header>

    <section class="now" aria-labelledby="now-title" aria-live="polite">
      <h1 id="now-title" class="sr-only"><span id="city-name">&nbsp;</span> akkurat nå</h1>
      <div class="now-icon" id="now-icon"></div>
      <div class="now-text">
        <p class="now-temp"><span id="now-temp">–</span><span class="deg"> °C</span></p>
        <p class="now-cond" id="now-cond">&nbsp;</p>
      </div>
    </section>

    <section class="nowcast card" aria-labelledby="nowcast-title">
      <div class="nowcast-head">
        <div>
          <h2 id="nowcast-title">&nbsp;</h2>
          <p class="muted" id="nowcast-total">&nbsp;</p>
        </div>
        <div class="nowcast-icon" id="nowcast-icon"></div>
      </div>
      <div class="chart" id="nowcast-chart" role="img" aria-label="Nedbørsintensitet de neste 60 minuttene"></div>
      <div class="chart-axis" aria-hidden="true"><span>Nå</span><span>30 min</span><span>60 min</span></div>
    </section>

    <section class="week" aria-labelledby="week-title">
      <h2 id="week-title" class="sr-only">Neste 7 dager</h2>
      <ol class="days" id="days"></ol>
    </section>

    <p class="error" id="error" role="alert" hidden></p>

    <footer class="footer">
      Værdata levert av <a href="https://www.met.no/" target="_blank" rel="noopener">Meteorologisk institutt</a>
      (<a href="https://api.met.no/doc/License" target="_blank" rel="noopener">CC BY 4.0</a>).
      <span id="updated">Henter vær …</span>
    </footer>
  </main>

  <script type="module" src="js/main.js"></script>
</body>
</html>
